name: TEMP - Slack Payload Serialization Check

on:
  push:
    branches:
      - enrich-notifications
    paths:
      - .github/workflows/test-notify-payload.yml

permissions:
  contents: read

jobs:
  test-payload:
    runs-on: ubuntu-latest
    steps:
      - name: Compose test Slack payload
        id: compose
        uses: actions/github-script@v7
        env:
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        with:
          github-token: ${{ github.token }}
          script: |
            const testTitle = 'Payload check: "quoted" { key: value }';

            return {
              channel: process.env.SLACK_CHANNEL_ID,
              text: "Temporary Slack payload serialization check",
              blocks: [{
                type: "section",
                text: {
                  type: "mrkdwn",
                  text: `Round-trip test value: ${testTitle}`
                }
              }]
            };

      - name: Send test Slack notification
        id: slack
        uses: slackapi/slack-github-action@v2.1.1
        with:
          errors: true
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: ${{ steps.compose.outputs.result }}
