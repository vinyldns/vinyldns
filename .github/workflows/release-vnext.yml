name: VinylDNS Release vNext
concurrency:
  cancel-in-progress: true
  group: "release-vnext"

defaults:
  run:
    shell: bash

on:
  push:
    branches: [ 'master','main' ]
  workflow_dispatch:

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:

  verify:
    name: Verify Release
    if: "!contains(github.event.head_commit.message, 'ci skip')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current branch
        if: github.event_name != 'push' # We only need to verify if this is manually triggered
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Build and Test
        if: github.event_name != 'push' # We only need to verify if this is manually triggered
        run: cd build/ && ./assemble_api.sh && ./run_all_tests.sh

  docker-release-api:
    name: Release API vNext Image
    needs: [ verify ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout current branch (full)
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Publish and Sign API Docker Image
        run: make -C build/docker/api publish-vnext

  docker-release-portal:
    name: Release Portal vNext Image
    needs: [ verify ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout current branch (full)
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Publish and Sign Portal Docker Image
        run: make -C build/docker/portal publish-vnext
